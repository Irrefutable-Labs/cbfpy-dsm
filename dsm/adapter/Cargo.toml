[package]
name = "ethical-autonomy-adapter"
description = "Experimental binding of ethical band decisions to existing DSM state transitions."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ethical-world = { path = "../world" }
# DSM, used through its public API only, pinned to the commit this was built and verified on.
dsm = { git = "https://github.com/deterministicstatemachine/dsm", rev = "b6060a3349ead0ccbfd853cd74f1d058e323e2ba" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
libc = "0.2"
# To ask a local model through Ollama, on this machine only. No TLS: it never leaves localhost.
ureq = { version = "2.12", default-features = false, features = ["json"] }

[[bin]]
name = "ethical-app"
path = "src/bin/app.rs"

[[bin]]
name = "ethical-enforcer"
path = "src/bin/enforcer.rs"

[[bin]]
name = "ethical-agent"
path = "src/bin/agent.rs"

[[bin]]
name = "ethical-audit"
path = "src/bin/audit.rs"

[[bin]]
name = "ethical-sign-charter"
path = "src/bin/sign_charter.rs"


[[bin]]
name = "ethical-trace"
path = "src/bin/trace.rs"

[[bin]]
name = "ethical-console"
path = "src/bin/console.rs"
