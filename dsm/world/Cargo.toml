[package]
name = "ethical-world"
description = "Protected life as deterministic checks: who is protected, what an act can reach, what has been seen, and what an act would do to anyone's quality of life. Integers only, no clock. Also a labelled simulator for trying it out."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
