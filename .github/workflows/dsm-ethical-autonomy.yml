name: dsm-ethical-autonomy

on:
  push:
    branches: [main, dsm-ethical-autonomy]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Engine, DSM adapter and demo tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dsm
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: dsm
      - name: Tests
        run: cargo test --release --locked --no-fail-fast

  cbfpy:
    name: CBFpy cross-check on the charter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        working-directory: dsm
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: dsm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CBFpy from this fork
        run: python -m pip install -e .
      - name: Cross-check
        env:
          JAX_PLATFORMS: cpu
          JAX_ENABLE_X64: "1"
        run: python -m unittest -v test.test_ethics_crosscheck

  lean:
    name: Lean proofs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check the proofs
        working-directory: dsm/lean
        run: |
          lean BandInvariant.lean | tee lean.out
          if grep -q sorryAx lean.out; then echo "a proof uses sorry"; exit 1; fi
