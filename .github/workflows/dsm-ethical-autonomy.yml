name: dsm-ethical-autonomy

on:
  push:
    branches: [main, dsm-ethical-autonomy]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Engine, DSM adapter and demo tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dsm
    steps:
      - uses: actions/checkout@v4
      - name: Install protoc
        # DSM's build script compiles its protocol with prost, which needs protoc. DSM's own CI
        # installs it the same way.
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler bubblewrap
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: dsm
      - name: Let bubblewrap make its namespaces
        # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor, which stops
        # bwrap from starting. The command-sandbox tests need it to start.
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Tests
        run: cargo test --release --locked --no-fail-fast

  macos:
    name: Tests on macOS, with sandbox-exec
    # The command sandbox on macOS is sandbox-exec, and the agent-isolation test runs only there.
    runs-on: macos-latest
    defaults:
      run:
        working-directory: dsm
    steps:
      - uses: actions/checkout@v4
      - name: Install protoc
        run: brew install protobuf
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: dsm
      - name: Tests
        run: cargo test --release --locked --no-fail-fast

  lint:
    name: Formatting and Clippy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dsm
    steps:
      - uses: actions/checkout@v4
      - name: Install protoc
        # DSM's build script compiles its protocol with prost, which needs protoc. DSM's own CI
        # installs it the same way.
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler bubblewrap
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: dsm
      - name: Formatting
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --release --all-targets --locked -- -D warnings

  cbfpy:
    name: CBFpy cross-check on the charter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install protoc
        # DSM's build script compiles its protocol with prost, which needs protoc. DSM's own CI
        # installs it the same way.
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler bubblewrap
      - name: Install the pinned toolchain
        working-directory: dsm
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: dsm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CBFpy from this fork
        run: python -m pip install -e .
      - name: Cross-check
        env:
          JAX_PLATFORMS: cpu
          JAX_ENABLE_X64: "1"
        run: python -m unittest -v test.test_ethics_crosscheck

  lean:
    name: Lean proofs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check the proofs
        working-directory: dsm/lean
        run: |
          lean ProtectedLife.lean | tee lean.out
          if grep -q sorryAx lean.out; then echo "a proof uses sorry"; exit 1; fi
